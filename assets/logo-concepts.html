<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>StudyFox Simple Foxes</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fffaf0;--card:#fff;--ink:#1a1a1a;--muted:#555;--fox:#f9a825}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Space Grotesk',sans-serif;padding:32px 16px}
h1{margin:0 0 4px;font-size:2rem}p.lead{color:var(--muted);margin:0 0 28px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:22px;max-width:1100px}
.card{background:var(--card);border:3px solid var(--ink);box-shadow:6px 6px 0 var(--ink);border-radius:14px;padding:20px}
.card h2{margin:0 0 2px;font-size:1.15rem}.card p{margin:0 0 16px;color:var(--muted);font-size:.92rem}
.lockup{display:flex;align-items:center;gap:12px;font-weight:700;font-size:2.1rem;letter-spacing:-1px;padding:14px;border-radius:10px}
.lockup svg{width:56px;height:56px;flex:none}
.dark{background:var(--ink);color:#fff;margin-top:10px}
.sizes{display:flex;align-items:end;gap:14px;margin-top:14px}.sizes svg{display:block}
.o{color:var(--fox)}
</style></head><body>
<h1>Flat fox</h1>

<div class="grid" id="grid"></div>
<script>
const concepts=[
 ['o2','Pencil orange','Warmer yellow-orange, like a classic pencil, with the white outline.'],
 ['o3','Pencil yellow','Brighter, closer to a #2 pencil yellow, with the white outline.'],
 ['o1','S3 flat, v2 + outline','White outline around the outside, on every background.'],
 ['n1','S3 flat, v2','Bigger triangle nose that forms the bottom point of the face. Eyes higher, well clear of the cream.'],
 ['n2','S3 flat, v2 tinted','Same, with a warmer cream so the face shape still shows on light backgrounds.'],
 ['p1','P1. Pencil (current)','The current fox: the bottom of the snout is now a sharpened pencil tip, and the eyes sit higher.'],
 ['p2','P2. Pencil (S1)','Same pencil tip on the simpler S1 fox, eyes moved up.'],
 ['s0','Current','What the site uses now, for comparison.'],
 ['s1','S1. Clean','Dot eyes and nose, no inner ears or cheek tufts. Simplest version that still has a face.'],
 ['s2','S2. Faceless','Just the head and the white mask. Very iconic, very minimal.'],
 ['s3','S3. Flat','No outline and no shadow. Calm and modern.'],
 ['s4','S4. Soft','Rounded corners everywhere, so it feels friendlier.'],
 ['s5','S5. Line','A single-colour outline. Matches the text colour, light or dark.'],
 ['s6','S6. Solid','All orange with dot eyes and a nose, no white mask.'],
];
document.getElementById('grid').innerHTML=concepts.map(([id,t,d])=>`
 <div class="card"><h2>${t}</h2><p>${d}</p>
  <div class="lockup"><svg><use href="#${id}"/></svg><span>Study<span class="o">Fox</span></span></div>
  <div class="lockup dark"><svg><use href="#${id}"/></svg><span>Study<span class="o">Fox</span></span></div>
  <div class="sizes"><svg width="64" height="64"><use href="#${id}"/></svg><svg width="32" height="32"><use href="#${id}"/></svg><svg width="16" height="16"><use href="#${id}"/></svg></div>
 </div>`).join('');
</script>
</body></html>
