<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>StudyFox · Account created</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 17px -apple-system, system-ui, sans-serif; background: #f5f7f2; color: #14231a; text-align: center; padding: 24px; box-sizing: border-box; }
  @media (prefers-color-scheme: dark) { body { background: #0a0f0c; color: #e8efe9; } }
  main { max-width: 420px; }
  h1 { font-size: 1.6rem; margin: 0 0 8px; }
  p { margin: 0 0 8px; opacity: .8; }
  a { display: inline-block; margin-top: 16px; padding: 14px 22px; border-radius: 14px; background: #1f6b47; color: #fff; text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1 id="title">Account created</h1>
  <p id="msg">Your email is confirmed. You can log in now and close this tab.</p>
  <a href="/#/login">Log in</a>
</main>
<script>
  // Email confirmation links land here. Supabase confirms the address before redirecting,
  // so this page only reports the result; an expired or reused link comes back with an error.
  (function () {
    var p = new URLSearchParams(location.search + '&' + location.hash.slice(1));
    var err = p.get('error_description');
    if (!err) return;
    document.getElementById('title').textContent = 'That link didn’t work';
    document.getElementById('msg').textContent = err.replace(/\+/g, ' ') + '. Try logging in, or sign up again to get a new link.';
  })();
</script>
</body>
</html>
